<svg viewBox="0 0 1560 860" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="arrowDotted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .flowSolid {
        stroke-dasharray: 6 6;
        animation: dashMove 1.1s linear infinite;
      }
      .flowDotted {
        stroke-dasharray: 3 5;
        animation: dashMove 0.9s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -24; }
      }
      .pulseBox {
        animation: pulseGlow 2.6s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { stroke-width: 1.5; }
        50% { stroke-width: 2.6; }
      }
    </style>
  </defs>

  <!-- outer border -->
  <rect x="4" y="4" width="1552" height="852" fill="white" stroke="#000" stroke-width="3"/>

  <!-- ============ FRONTEND APPLICATION (top right) ============ -->
  <rect x="855" y="20" width="545" height="300" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1127" y="42" text-anchor="middle" font-size="16" fill="#111">Frontend Application</text>

  <rect class="pulseBox" x="1010" y="60" width="235" height="70" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1127" y="90" text-anchor="middle" font-size="14" fill="#111">Vite</text>
  <text x="1127" y="110" text-anchor="middle" font-size="12.5" fill="#333">Build Tool, Optimizer &amp; HMR</text>

  <path id="p-orchestrate" class="flowSolid" d="M1127,130 L1127,195" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1055" y="147" width="145" height="22" fill="#c9c9c9"/>
  <text x="1127" y="163" text-anchor="middle" font-size="12" fill="#111">Orchestrates</text>

  <rect class="pulseBox" x="990" y="198" width="275" height="72" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1127" y="228" text-anchor="middle" font-size="14" fill="#111">React + TypeScript</text>
  <text x="1127" y="248" text-anchor="middle" font-size="12.5" fill="#333">Client-Side UI &amp; SPA Routing</text>

  <!-- fan-out from React box -->
  <path id="p-standard" class="flowSolid" d="M1050,270 L990,400" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path id="p-complex" class="flowSolid" d="M1210,270 L1305,400" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="920" y="325" width="175" height="24" fill="#c9c9c9"/>
  <text x="1007" y="342" text-anchor="middle" font-size="12" fill="#111">Standard Data Requests</text>

  <rect x="1215" y="315" width="200" height="38" fill="#c9c9c9"/>
  <text x="1315" y="332" text-anchor="middle" font-size="12" fill="#111">Complex Workflows &amp;</text>
  <text x="1315" y="347" text-anchor="middle" font-size="12" fill="#111">AI Tasks</text>

  <!-- ============ EXTERNAL ACCESS LAYER (top left) ============ -->
  <rect x="12" y="170" width="545" height="225" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="284" y="192" text-anchor="middle" font-size="16" fill="#111">External Access Layer</text>

  <rect class="pulseBox" x="30" y="205" width="225" height="80" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="142" y="228" text-anchor="middle" font-size="13.5" fill="#111">External AI Clients</text>
  <text x="142" y="248" text-anchor="middle" font-size="12.5" fill="#333">Claude · ChatGPT</text>
  <text x="142" y="266" text-anchor="middle" font-size="12.5" fill="#333">Third-party Developers</text>

  <rect class="pulseBox" x="295" y="205" width="225" height="80" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="407" y="228" text-anchor="middle" font-size="13.5" fill="#111">API Consumers</text>
  <text x="407" y="248" text-anchor="middle" font-size="12.5" fill="#333">Mobile Apps · Integrations</text>
  <text x="407" y="266" text-anchor="middle" font-size="12.5" fill="#333">Health Tech Partners</text>

  <path id="p-toolcalls" class="flowSolid" d="M142,285 L142,345" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="102" y="303" width="80" height="22" fill="#c9c9c9"/>
  <text x="142" y="319" text-anchor="middle" font-size="12" fill="#111">Tool Calls</text>

  <path id="p-restheader" class="flowDotted" d="M407,285 L407,325" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrowDotted)"/>
  <rect x="317" y="335" width="180" height="38" fill="#c9c9c9"/>
  <text x="407" y="352" text-anchor="middle" font-size="12" fill="#111">REST Calls · x-api-key</text>
  <text x="407" y="367" text-anchor="middle" font-size="12" fill="#111">Header</text>

  <rect class="pulseBox" x="30" y="345" width="225" height="80" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="142" y="368" text-anchor="middle" font-size="13.5" fill="#111">MCP Server</text>
  <text x="142" y="388" text-anchor="middle" font-size="12.5" fill="#333">Model Context Protocol</text>
  <text x="142" y="406" text-anchor="middle" font-size="12.5" fill="#333">Hosted on Railway</text>

  <!-- dotted line from REST calls label curving to backend layer -->
  <path id="p-restcurve" class="flowDotted" d="M497,354 C 560,354 570,455 620,470" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrowDotted)"/>

  <!-- ============ BACKEND & API LAYER (middle) ============ -->
  <rect x="580" y="398" width="890" height="175" fill="#f4f4f4" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1025" y="420" text-anchor="middle" font-size="15" fill="#111">Backend &amp; API Layer — Supabase Ecosystem</text>

  <rect class="pulseBox" x="620" y="432" width="270" height="98" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="755" y="454" text-anchor="middle" font-size="13.5" fill="#111">Developer REST API</text>
  <text x="755" y="474" text-anchor="middle" font-size="12" fill="#333">API Key Auth · Rate Limiting</text>
  <text x="755" y="491" text-anchor="middle" font-size="12" fill="#333">Scoped Permissions</text>
  <text x="755" y="508" text-anchor="middle" font-size="12" fill="#333">free/pro/enterprise</text>

  <rect class="pulseBox" x="925" y="452" width="180" height="65" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1015" y="478" text-anchor="middle" font-size="13.5" fill="#111">PostgREST</text>
  <text x="1015" y="497" text-anchor="middle" font-size="12" fill="#333">Auto-generated Core API</text>

  <rect class="pulseBox" x="1215" y="452" width="220" height="65" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1325" y="478" text-anchor="middle" font-size="13.5" fill="#111">Edge Functions</text>
  <text x="1325" y="497" text-anchor="middle" font-size="12" fill="#333">Serverless Deno Runtime</text>

  <!-- ============ DATABASE LAYER (bottom left) ============ -->
  <rect x="12" y="605" width="1170" height="235" fill="#f4f4f4" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="597" y="627" text-anchor="middle" font-size="15" fill="#111">Database Layer</text>

  <!-- cylinder -->
  <g class="pulseBox">
    <path d="M715,655 a90,20 0 0 0 -180,0 v90 a90,20 0 0 0 180,0 z" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
    <ellipse cx="625" cy="655" rx="90" ry="20" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
    <text x="625" y="700" text-anchor="middle" font-size="13.5" fill="#111">PostgreSQL</text>
    <text x="625" y="720" text-anchor="middle" font-size="12" fill="#333">ACID · RLS · Realtime ·</text>
    <text x="625" y="736" text-anchor="middle" font-size="12" fill="#333">Views</text>
  </g>

  <!-- ============ AI INTEGRATION (bottom right) ============ -->
  <rect x="1210" y="605" width="340" height="235" fill="#f4f4f4" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1380" y="627" text-anchor="middle" font-size="15" fill="#111">AI Integration</text>

  <rect class="pulseBox" x="1245" y="670" width="270" height="90" fill="white" stroke="#1a1a3d" stroke-width="1.5"/>
  <text x="1380" y="695" text-anchor="middle" font-size="13.5" fill="#111">Google Gemini API</text>
  <text x="1380" y="716" text-anchor="middle" font-size="12" fill="#333">Gemini 2.5 Flash · Medical</text>
  <text x="1380" y="733" text-anchor="middle" font-size="12" fill="#333">Chatbots</text>

  <!-- ============ CONNECTING ARROWS ============ -->

  <!-- MCP Server -> reads provider data -> DB -->
  <path id="p-mcpread" class="flowDotted" d="M142,425 C 142,560 260,600 350,613" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrowDotted)"/>
  <rect x="45" y="588" width="185" height="22" fill="#c9c9c9"/>
  <text x="137" y="604" text-anchor="middle" font-size="12" fill="#111">Reads Provider Data</text>

  <!-- Developer REST API -> queries & usage logs -> DB -->
  <path id="p-usagelog" class="flowDotted" d="M755,530 L700,613" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrowDotted)"/>
  <rect x="638" y="565" width="175" height="22" fill="#c9c9c9"/>
  <text x="725" y="581" text-anchor="middle" font-size="12" fill="#111">Queries &amp; Usage Logs</text>

  <!-- PostgREST -> CRUD Operations -> DB -->
  <path id="p-crud" class="flowSolid" d="M1015,517 L720,640" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="925" y="565" width="155" height="22" fill="#c9c9c9"/>
  <text x="1002" y="581" text-anchor="middle" font-size="12" fill="#111">CRUD Operations</text>

  <!-- Edge Functions -> State & Logging -> DB -->
  <path id="p-state" class="flowSolid" d="M1290,517 L740,655" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1140" y="565" width="145" height="22" fill="#c9c9c9"/>
  <text x="1212" y="581" text-anchor="middle" font-size="12" fill="#111">State &amp; Logging</text>

  <!-- Edge Functions -> AI Orchestration -> Gemini -->
  <path id="p-aiorch" class="flowSolid" d="M1360,517 L1380,667" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1298" y="583" width="165" height="22" fill="#c9c9c9"/>
  <text x="1380" y="599" text-anchor="middle" font-size="12" fill="#111">AI Orchestration</text>

  <!-- ============ TRAVELING DATA DOTS ============ -->
  <circle r="4.5" fill="#0d7377">
    <animateMotion dur="1.3s" repeatCount="indefinite">
      <mpath href="#p-orchestrate"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#0d7377">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#p-standard"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#7c3aed">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#p-complex"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#0d7377">
    <animateMotion dur="1.2s" repeatCount="indefinite">
      <mpath href="#p-toolcalls"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#888">
    <animateMotion dur="1.6s" repeatCount="indefinite">
      <mpath href="#p-restheader"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#888">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#p-restcurve"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#888">
    <animateMotion dur="2.6s" repeatCount="indefinite">
      <mpath href="#p-mcpread"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#888">
    <animateMotion dur="1.5s" repeatCount="indefinite">
      <mpath href="#p-usagelog"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#0d7377">
    <animateMotion dur="1.7s" repeatCount="indefinite">
      <mpath href="#p-crud"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#0d7377">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#p-state"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#7c3aed">
    <animateMotion dur="1.3s" repeatCount="indefinite">
      <mpath href="#p-aiorch"/>
    </animateMotion>
  </circle>

</svg>
